name: Upstream Build Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "assessments/**"
      - "decisions/**"
      - "prototypes/**"
      - ".github/workflows/upstream-build-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-build-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-task-queue:
    name: Agent Task Queue / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b

      - name: Fetch pinned upstream
        run: |
          git clone --filter=blob:none https://github.com/block/agent-task-queue.git upstream
          cd upstream
          git checkout ccb94ae25c2b286d62e7371fd4c0f7ce60e33efa
          test "$(git rev-parse HEAD)" = "ccb94ae25c2b286d62e7371fd4c0f7ce60e33efa"

      - name: Set up Python
        working-directory: upstream
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: upstream
        env:
          UV_DEFAULT_INDEX: https://pypi.org/simple
          UV_INDEX_URL: https://pypi.org/simple
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Lint upstream snapshot
        id: lint
        continue-on-error: true
        working-directory: upstream
        run: uv run --python ${{ matrix.python-version }} ruff check .

      - name: Test upstream snapshot
        if: always()
        working-directory: upstream
        run: uv run --python ${{ matrix.python-version }} pytest -v

      - name: Record upstream lint drift
        if: always() && steps.lint.outcome != 'success'
        run: echo "::warning::Pinned Agent Task Queue snapshot has Ruff lint drift. Build and test evidence remains independently evaluated."

  ai-rules:
    name: AI Rules / Rust build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned upstream
        run: |
          git clone --filter=blob:none https://github.com/block/ai-rules.git upstream
          cd upstream
          git checkout b2c1cd16d05f47053eb3f059f87524f7b6ee1a1f
          test "$(git rev-parse HEAD)" = "b2c1cd16d05f47053eb3f059f87524f7b6ee1a1f"

      - name: Verify license evidence
        working-directory: upstream
        run: |
          test -f LICENSE
          grep -q "Apache License" LICENSE
          grep -q 'license = "Apache License 2.0"' Cargo.toml

      - name: Format check
        working-directory: upstream
        run: |
          source bin/activate-hermit
          cargo fmt --check

      - name: Clippy
        working-directory: upstream
        run: |
          source bin/activate-hermit
          ./scripts/clippy-check.sh

      - name: Test
        working-directory: upstream
        run: |
          source bin/activate-hermit
          cargo test --verbose

      - name: Release build
        working-directory: upstream
        run: |
          source bin/activate-hermit
          cargo build --release --verbose

  xcode-index-license-gate:
    name: Xcode Index MCP / license evidence
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pinned upstream
        run: |
          git clone --filter=blob:none https://github.com/block/xcode-index-mcp.git upstream
          cd upstream
          git checkout c89af82aee64c42690a60c2dda6d9e0f8bf022e9
          test "$(git rev-parse HEAD)" = "c89af82aee64c42690a60c2dda6d9e0f8bf022e9"

      - name: Inspect tracked license evidence
        working-directory: upstream
        run: |
          echo "Tracked license-like files:"
          git ls-tree -r --name-only HEAD | grep -Ei '(^|/)(LICENSE|COPYING|NOTICE)(\..*)?$' || true
          if git cat-file -e HEAD:LICENSE 2>/dev/null; then
            echo "--- HEAD:LICENSE (first 20 lines) ---"
            git show HEAD:LICENSE | sed -n '1,20p'
          else
            echo "No tracked root LICENSE blob at the pinned revision."
          fi
          echo "--- pyproject license declarations ---"
          grep -En '^license[[:space:]]*=' pyproject.toml || true
